name: Update champion

on:
  schedule:
    # Cron fijo cada 5 min (como el de naciones). update_from_api.py decide
    # internamente si toca actuar: chequeo horario base + ventana de fin del
    # próximo partido. Si no toca, exit 0 sin llamar a la API ni commitear.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar update aunque no toque (1=sí)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: update-champion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run API update
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          FORCE_UPDATE: ${{ github.event.inputs.force || '0' }}
        run: python update_from_api.py

      - name: Re-export web data
        run: python export_web.py

      - name: Commit + push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name  "github-actions[bot]"
            git add -A
            git commit -m "chore: daily champion update from api-football"
            # La Action de nations tambien empuja a main; rebase para evitar
            # rechazos por solape de pushes.
            git pull --rebase origin main
            git push
          else
            echo "No changes."
          fi
